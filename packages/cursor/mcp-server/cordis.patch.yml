# Cursor MCP stdio server over dsh-base. No Host, HTTP, or browser layer.
# Stdout is reserved for MCP JSON-RPC; this overlay mounts no logger.
#
# Cursor's MCP client gives about 30s for initialize. A full dsh-base load
# through tsx on Windows can exceed that, so unused base rows stay disabled
# here. Keep pwsh-sandbox enabled on win32: permission-presets injects shell.
# A later extra that needs a disabled row fails at Loader time.

